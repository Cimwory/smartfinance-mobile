name: Build iOS App

on:
  # Ini memungkinkan Anda menekan tombol "Run workflow" secara manual di website GitHub
  workflow_dispatch: 

jobs:
  build-ios:
    # Meminjam mesin komputer Mac (macOS) dari GitHub
    runs-on: macos-latest

    steps:
      - name: Clone Kode dari Repository
        uses: actions/checkout@v4

      - name: Setup Instalasi Flutter di Mac
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Package/Library
        run: flutter pub get

      - name: Build Aplikasi iOS (Tanpa Sertifikat)
        # Kita menggunakan --no-codesign karena Anda belum memasukkan Sertifikat Developer Apple berbayar
        run: flutter build ios --release --no-codesign

      - name: Upload Hasil Aplikasi (.app)
        uses: actions/upload-artifact@v4
        with:
          name: Aplikasi-iOS
          path: build/ios/iphoneos/Runner.app
